<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Estrattore Casuale di Domande - Elettronica</title>

        body {

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 650px;
            width: 90%;
        }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 25px; }
        .domanda { font-size: 18px; color: #34495e; min-height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; line-height: 1.6; font-weight: 500; }
        .contatore { font-size: 12px; color: #95a5a6; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h1>Estrattore Casuale di Domande</h1>
    <div id="contatore" class="contatore">Pronto</div>
    <div id="domanda" class="domanda">Premi il pulsante per estrarre una domanda casuale dall'intero programma di teoria.</div>
    <button onclick="estraiDomanda()">Estrai Domanda Casuale</button>
</div>

    const totale = archivioDomande.length;
    const indice = Math.floor(Math.random() * totale);
    const selezione = archivioDomande[indice];
    
    document.getElementById('contatore').innerText = `Domanda ${indice + 1} di ${totale}`;

}
